# Prismatic Shards dock — macOS-style floating glass dock.
# Backend: nwg-dock-hyprland (Hyprland-native, blur comes from hyprland.lua
# layer rule `prismatic-blur-dock` on namespace ^prismatic-dock$).
layer = "top"
position = "bottom"
alignment = "center"
margin_bottom = 10
icon_size = 40
icon_padding = 8
spacing = 6
border_radius = 20
background_opacity = 0.55
border_width = 1
border_color = "rgba(4da3ffd9)"
cursor_theme = "Prismatic-Shards"
hotspot_delay = 300
autohide = false
animation_duration = 250
zoom_factor = 1.5
favorites = ["firefox", "kitty", "code", "nautilus", "spotify"]
